<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binance Analiz</title>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}body{background:#090d16;color:#f1f5f9;padding:18px}.c{max-width:1200px;margin:auto;display:flex;flex-direction:column;gap:16px}.card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:16px}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}.btn{background:#1f2937;color:#fff;border:1px solid #374151;padding:8px 14px;border-radius:8px;text-decoration:none;font-size:13px;font-weight:700;cursor:pointer}.pri{background:#facc15;color:#090d16;border:none}.rb{background:#1f2937;color:#cbd5e1;border:none;padding:6px 11px;border-radius:7px;font-size:12px;cursor:pointer;font-weight:700}.rb.act{background:#facc15;color:#090d16}input,select{background:#090d16;color:#fff;border:1px solid #374151;padding:6px 9px;border-radius:7px;font-size:12px;color-scheme:dark}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.kpi{background:#111827;border:1px solid #1f2937;border-radius:10px;padding:14px}.kt{font-size:11px;color:#94a3b8;font-weight:700}.kv{font-size:18px;font-weight:800;margin-top:4px}.g2{display:grid;grid-template-columns:2fr 1fr;gap:16px}@media(max-width:800px){.g2{grid-template-columns:1fr}}.ch{height:210px;background:#090d16;border:1px solid #1f2937;border-radius:9px;margin-top:8px;display:flex;align-items:center;justify-content:center;padding:8px}table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}th{text-align:left;color:#94a3b8;padding:8px;border-bottom:1px solid #1f2937;background:#090d16;position:sticky;top:0}td{padding:8px;border-bottom:1px solid #1f2937}.sc{max-height:250px;overflow-y:auto}</style></head>
<body data-exchange="binance"><div class="c">
<div class="card row"><div><small style="color:#facc15;font-weight:700">● BINANCE DEMO</small><h2>Binance Analiz Merkezi</h2></div><div class="row"><a href="/bybit.html" class="btn">Bybit'e Geç →</a><button id="btnRef" class="btn pri">Yenile</button></div></div>
<div class="card row"><div class="row"><button class="rb" data-r="today">Bugün</button><button class="rb" data-r="7d">7 Gün</button><button class="rb" data-r="30d">30 Gün</button><button class="rb act" data-r="all">Tümü</button></div><div class="row"><input type="date" id="dStart"><input type="date" id="dEnd"><select id="fCoin"><option value="ALL">Tüm Pariteler</option></select><select id="fRes"><option value="ALL">Tümü</option><option value="WIN">Kârlı</option><option value="LOSS">Zararlı</option></select></div></div>
<div id="msg" class="card" style="text-align:center;color:#94a3b8">Yükleniyor...</div>
<div id="app" style="display:none;flex-direction:column;gap:16px">
<!-- KPI, PnL eğrisi, parite ve işlem tabloları -->
</div></div><script src="/app.js"></script></body></html>
